<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>ZAMRUD KASIR</title>
  <meta name="theme-color" content="#063826">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Zamrud Kasir">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="assets/ikon-192.png?v=2">
  <link rel="apple-touch-icon" href="assets/ikon-180.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <script>
    // pasangan font (judul + angka/kode) dimuat sedini mungkin agar tidak berkedip
    window.ZK_FONT = {
      grotesk: ['Space Grotesk', 'JetBrains Mono', 'Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700'],
      sora: ['Sora', 'IBM Plex Mono', 'Sora:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600'],
      outfit: ['Outfit', 'Fira Code', 'Outfit:wght@400;500;600;700;800&family=Fira+Code:wght@400;500;600'],
      jakarta: ['Plus Jakarta Sans', 'Space Mono', 'Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Mono:wght@400;700'],
    };
    (function () {
      var k = 'grotesk'; try { k = localStorage.getItem('zk_font') || k; } catch (e) {}
      var f = ZK_FONT[k] || ZK_FONT.grotesk;
      document.write('<link id="zk-font" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=' + f[2] + '&display=swap">');
      var r = document.documentElement.style;
      r.setProperty('--font-judul', '"' + f[0] + '"'); r.setProperty('--font-kode', '"' + f[1] + '"');
    })();
  </script>
  <link rel="stylesheet" href="css/app.css?v=8">
</head>
<body>
  <div id="akar"></div>
  <noscript>Aktifkan JavaScript untuk memakai ZAMRUD KASIR.</noscript>
  <script type="module" src="js/app.js?v=8"></script>
</body>
</html>
